<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAHEL LUXE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}nav{display:flex;gap:2px;padding:5px;background:#111;position:fixed;bottom:0;width:100%}nav button{flex:1;padding:10px;background:#222;color:#fff;border:none;border-radius:8px;font-size:9px}nav button.active{background:gold;color:#000;font-weight:bold}.tab{padding:10px;padding-bottom:70px;display:none}.tab.active{display:block}.product{background:#111;margin:6px 0;padding:8px;border-radius:8px;border:1px solid #333}input{width:100%;padding:10px;background:#222;border:1px solid #333;color:#fff;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<div id="tabChat" class="tab active"><h2 style="color:gold;text-align:center;padding:10px">💬 CHAT SAHEL LUXE</h2><div id="chatList" style="height:300px;overflow:auto;background:#111;border-radius:8px;padding:5px"></div><div style="display:flex;gap:5px"><input id="chatInput" placeholder="Message..."><button onclick="sendMessage()" style="background:gold;color:#000;padding:10px 15px;border-radius:8px">Envoyer</button></div></div>
<div id="tabVideos" class="tab"><h2 style="color:gold;text-align:center">🎵 TIKTOK SAHEL</h2><div id="videoFeed"></div></div>
<div id="tabCommerce" class="tab"><h2 style="color:gold;text-align:center">🛒 BOUTIQUE 97028392</h2><div style="display:flex;gap:3px;overflow:auto"><button onclick="showCommerceCat('homme')" style="background:gold;color:#000;padding:6px;border-radius:6px">HOMME</button><button onclick="showCommerceCat('femme')" style="background:#222;color:#fff;padding:6px;border-radius:6px">FEMME</button><button onclick="showCommerceCat('voiture')" style="background:#222;color:#fff;padding:6px;border-radius:6px">VOITURE</button><button onclick="showCommerceCat('bazin')" style="background:#222;color:#fff;padding:6px;border-radius:6px">BAZIN</button><button onclick="showCommerceCat('montre')" style="background:#222;color:#fff;padding:6px;border-radius:6px">MONTRE</button></div><div id="commerceProducts"></div><div style="position:fixed;bottom:60px;right:10px;background:gold;color:#000;padding:8px;border-radius:10px">🛒 <span id="cartCount">0</span> | <span id="cartTotal">0</span> <button onclick="checkout()" style="background:#000;color:gold;padding:4px;border-radius:5px">PAYER</button></div></div>
<div id="tabMoney" class="tab"><h2 style="color:gold;text-align:center">💰 MONEY 70%</h2><p>Subs: <b id="mySubs">1240</b>/10000</p><div style="background:#222;height:10px;border-radius:5px"><div id="progressSubs" style="background:gold;height:10px;width:12%"></div></div><p>Vues: <b id="myViews">15400</b>/100000</p><div style="background:#222;height:10px;border-radius:5px"><div id="progressViews" style="background:gold;height:10px;width:15%"></div></div><button id="btnMonetize" disabled onclick="requestMonetization()" style="width:100%;margin-top:15px;padding:12px;background:#444;color:#fff;border-radius:8px">🔒 Atteins 10k + 100k</button></div>
<div id="tabPost" class="tab"><h2 style="color:gold;text-align:center">➕ POSTER</h2><input id="videoTitle" placeholder="Titre vidéo"><button onclick="postVideo()" style="width:100%;padding:12px;background:gold;color:#000;border-radius:8px;margin-top:10px">📤 POSTER</button></div>
<nav><button id="bChat" class="active" onclick="showTab('chat')">💬<br>Chat</button><button id="bVideos" onclick="showTab('videos')">🎵<br>Videos</button><button id="bCommerce" onclick="showTab('commerce')">🛒<br>Shop</button><button id="bMoney" onclick="showTab('money')">💰<br>Money</button><button id="bPost" onclick="showTab('post')">➕<br>Post</button></nav>
<script src="app.js"></script>
</body>
</html>
